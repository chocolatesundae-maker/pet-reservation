<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paw-some Stay | Pet Reservations</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-peach: #ffb37e;
            --soft-cream: #fff9f0;
            --accent-brown: #6d4c41;
            --mint: #a8e6cf;
            --shadow: 0 8px 24px rgba(109, 76, 65, 0.15);
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--soft-cream);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--accent-brown);
        }

        /* --- LOGIN SECTION --- */
        #login-section {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
            width: 350px;
            border: 4px solid var(--primary-peach);
        }

        .paw-icon { font-size: 50px; margin-bottom: 10px; }
        h2 { font-family: 'Fredoka One', cursive; color: var(--primary-peach); margin-bottom: 25px; }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #eee;
            border-radius: 15px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
        }

        .btn {
            background: var(--primary-peach);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 15px;
            font-family: 'Fredoka One', cursive;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            width: 100%;
            font-size: 16px;
        }

        .btn:hover { background: #ff9e5e; transform: scale(1.02); }

        /* --- DASHBOARD SECTION --- */
        #dashboard {
            display: none;
            width: 90%;
            max-width: 1000px;
            background: white;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .sidebar {
            background: var(--primary-peach);
            padding: 30px;
            color: white;
            text-align: center;
        }

        .main-layout { display: flex; flex-direction: row; }
        
        .content { padding: 40px; flex-grow: 1; }

        .reservation-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .card {
            background: var(--soft-cream);
            padding: 20px;
            border-radius: 20px;
            border: 2px dashed var(--primary-peach);
        }

        .reservation-list {
            max-height: 400px;
            overflow-y: auto;
            margin-top: 15px;
        }

        .res-item {
            background: white;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid var(--mint);
        }

        .logout-btn {
            background: transparent;
            border: 2px solid white;
            color: white;
            margin-top: 20px;
            padding: 8px;
            border-radius: 10px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .main-layout { flex-direction: column; }
            .reservation-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="login-section">
        <div class="paw-icon">??</div>
        <h2>Paw-some Stay</h2>
        <p>Login to book a treat for your pet!</p>
        <input type="text" id="username" placeholder="Username (try 'admin')">
        <input type="password" id="password" placeholder="Password (try '1234')">
        <button class="btn" onclick="login()">ENTER THE DOGHOUSE</button>
    </div>

    <div id="dashboard">
        <div class="main-layout">
            <div class="sidebar">
                <div style="font-size: 60px;">??</div>
                <h2 style="color: white;">Hello, Hooman!</h2>
                <p>Ready for a nap-time booking?</p>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
            
            <div class="content">
                <div class="reservation-grid">
                    <div class="card">
                        <h3>Book a Stay ??</h3>
                        <input type="text" id="petName" placeholder="Pet's Name">
                        <select id="petType">
                            <option value="Dog">Good Boy (Dog)</option>
                            <option value="Cat">Grumpy Lord (Cat)</option>
                            <option value="Rabbit">Fluff Ball (Rabbit)</option>
                        </select>
                        <input type="date" id="resDate">
                        <button class="btn" onclick="addReservation()">BOOK NOW</button>
                    </div>

                    <div class="card">
                        <h3>Upcoming Stays ?</h3>
                        <div id="resList" class="reservation-list">
                            <p style="text-align: center; color: #aaa;">No bookings yet!</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mock Database
        let reservations = [];

        function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            if (u === 'admin' && p === '1234') {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                Swal.fire({ title: 'Welcome!', text: 'Wagging tails are waiting!', icon: 'success', confirmButtonColor: '#ffb37e' });
            } else {
                Swal.fire('Oops!', 'Wrong username or password', 'error');
            }
        }

        function logout() {
            document.getElementById('login-section').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
        }

        function addReservation() {
            const name = document.getElementById('petName').value;
            const type = document.getElementById('petType').value;
            const date = document.getElementById('resDate').value;

            if (!name || !date) {
                Swal.fire('Missing Info', 'Please fill in all fields!', 'warning');
                return;
            }

            const newRes = { name, type, date };
            reservations.push(newRes);
            updateList();
            
            // Clear inputs
            document.getElementById('petName').value = '';
            document.getElementById('resDate').value = '';

            Swal.fire({
                title: 'Booked!',
                text: `${name} is ready for their stay!`,
                icon: 'success',
                confirmButtonColor: '#a8e6cf'
            });
        }

        function updateList() {
            const listDiv = document.getElementById('resList');
            if (reservations.length === 0) {
                listDiv.innerHTML = '<p style="text-align: center; color: #aaa;">No bookings yet!</p>';
                return;
            }

            listDiv.innerHTML = reservations.map((res, index) => `
                <div class="res-item">
                    <div>
                        <strong>${res.name}</strong> (${res.type})<br>
                        <small style="color: #888;">?? ${res.date}</small>
                    </div>
                    <button onclick="deleteRes(${index})" style="background:none; border:none; cursor:pointer;">?</button>
                </div>
            `).join('');
        }

        function deleteRes(index) {
            reservations.splice(index, 1);
            updateList();
        }
    </script>
</body>
</html>
